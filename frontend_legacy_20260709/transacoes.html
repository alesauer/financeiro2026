<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maluki Budget</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
<link href="assets/css/nav.css" rel="stylesheet">
<link href="assets/css/transacoes.css" rel="stylesheet">

<script src="assets/js/nav.js" defer></script>

</head>

<body class="bg-light">

<!-- IMPORT NAVBAR -->
<nav-bar></nav-bar>

<!-- CARDS: Receitas, Despesas, Saldo -->
<div class="container py-3" id="cards-container">
  <div class="row g-2">
    <div class="col-6 col-lg-3">
      <div class="card text-white bg-success mb-0">
  <div class="card-header fw-bold">Receitas</div>
        <div class="card-body">
          <h5 class="card-title fw-bold" id="card-receitas">R$ 0,00</h5>
        </div>
      </div>
    </div>

    <div class="col-6 col-lg-3">
      <div class="card text-white bg-danger mb-0">
  <div class="card-header fw-bold">Despesas</div>
        <div class="card-body">
          <h5 class="card-title fw-bold" id="card-despesas">R$ 0,00</h5>
        </div>
      </div>
    </div>

    <div class="col-6 col-lg-3">
      <div class="card text-white bg-primary mb-0">
  <div class="card-header fw-bold">Saldo</div>
        <div class="card-body">
          <h5 class="card-title fw-bold" id="card-saldo">R$ 0,00</h5>
        </div>
      </div>
    </div>

    <!-- Box de despesas de cartão de crédito -->
    <div class="col-6 col-lg-3">
      <div class="card text-white bg-warning mb-0">
  <div class="card-header fw-bold">Despesas Cartão de Crédito</div>
        <div class="card-body">
          <h5 class="card-title fw-bold" id="card-cartao">R$ 0,00</h5>
        </div>
      </div>
    </div>
  </div>
</div>


<div class="container py-4">
<!--  <h2 class="mb-3">Transações</h2> --> 

  <div class="d-flex align-items-center mb-3">
    <button id="prevMonth" class="btn btn-outline-primary me-2">←</button>
    <div id="currentMonthLabel" class="me-2 fw-bold"></div>
    <button id="nextMonth" class="btn btn-outline-primary me-3">→</button>

    <label for="monthPicker" class="me-2">Selecionar mês:</label>
    <input id="monthPicker" type="month" class="form-control w-auto" />
  </div>

  <div id="grid"></div>
</div>

<div class="container pb-5">
  <div class="card shadow-sm" id="cartao-credito-panel">
    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <h5 class="mb-0 d-flex align-items-center gap-2 flex-wrap">
          <span class="titulo-cartao-credito d-inline-flex align-items-center gap-1">
            <i class="bi bi-credit-card-2-front"></i>
            Cartões
          </span>
          de Crédito
        </h5>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary btn-sm" id="btn-recarregar-cartoes">Atualizar</button>
        <button class="btn btn-outline-danger btn-sm" id="btn-cartoes-deletar-todos">Excluir todos</button>
        <button class="btn btn-outline-success btn-sm" id="btn-cartoes-marcar-pago">Marcar tudo como pago</button>
      </div>
    </div>
    <div class="card-body">
      <div id="cartao-credito-conteudo" class="table-responsive"></div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<app-footer></app-footer>

<script>
  if (!localStorage.getItem('access_token')) {
    window.location.href = 'login.html';
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
<script src="assets/js/transacoes.js"></script>
</body>
</html>
