<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/nav.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav-bar></nav-bar>

    <div class="container mt-4">
    <h2>Usuários</h2>
    <div id="alert-area"></div>
    <div class="d-flex flex-wrap gap-2 mb-3">
      <button class="btn btn-primary" id="btnAddUsuario">Adicionar Usuário</button>
      <a href="transacoes.html" class="btn btn-outline-secondary">Cancelar</a>
    </div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover" id="usuariosTable">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Data de Criação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linhas geradas via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Adicionar/Editar Usuário -->
    <div class="modal fade" id="usuarioModal" tabindex="-1" aria-labelledby="usuarioModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="usuarioModalLabel">Adicionar Usuário</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <form id="usuarioForm">
              <div class="mb-3">
                <label for="usuarioId" class="form-label">ID</label>
                <input type="text" class="form-control" id="usuarioId" disabled>
              </div>
              <div class="mb-3">
                <label for="usuarioNome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="usuarioNome" required>
              </div>
              <div class="mb-3">
                <label for="usuarioEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="usuarioEmail" required>
              </div>
              <div class="mb-3" id="senhaDiv">
                <label for="usuarioSenha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="usuarioSenha" required>
              </div>
              <input type="hidden" id="modalMode" value="add">
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="saveUsuarioBtn">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <app-footer></app-footer>

    <script>
      if (!localStorage.getItem('access_token')) {
        window.location.href = 'login.html';
      }
    </script>
    <script src="assets/js/nav.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/usuarios.js"></script>
</body>
</html>
