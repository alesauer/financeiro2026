<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet">
  <link href="assets/css/nav.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav-bar></nav-bar>

  <div class="container py-4">
    <h2 class="mb-4">Documentos</h2>
    <!-- Botão Novo Documento -->
    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-success" id="btn-novo-documento">Novo Documento</button>
    </div>

    <!-- Grid -->
    <div id="grid"></div>

    <!-- Modal Novo Documento -->
    <div class="modal fade" id="modalDocumento" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Novo Documento</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="formDocumento">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Tipo Documento</label>
                  <select class="form-select" id="tipo_documento_id" required></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Nome</label>
                  <input type="text" class="form-control" id="nome" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Registro</label>
                  <input type="text" class="form-control" id="registro" />
                </div>
                <div class="col-md-12">
                  <label class="form-label">Outras informações</label>
                  <textarea class="form-control" id="outras_informacoes" rows="3"></textarea>
                </div>
                <div class="col-md-12">
                  <label class="form-label">Anexar Documento (até 5 arquivos)</label>
                  <input type="file" class="form-control" id="files" multiple accept="application/pdf,image/*" />
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btn-salvar-documento">Salvar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <app-footer></app-footer>

  <script src="assets/js/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/documentos.js"></script>
</body>
</html>
