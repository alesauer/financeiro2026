<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importar Cartão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/nav.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav-bar></nav-bar>

  <div class="container py-4">
    <h2 class="mb-4">Importar Cartão</h2>
    <div class="card p-4 mb-4">
      <form id="form-import-csv">
        <div class="mb-3">
          <label for="arquivoCartao" class="form-label">Selecione o arquivo do cartão (.csv):</label>
          <input class="form-control" type="file" id="arquivoCartao" accept=".csv">
        </div>
        <div class="mb-3">
          <label for="formaCartaoSelect" class="form-label">Cartão de crédito utilizado:</label>
          <select class="form-select" id="formaCartaoSelect" required>
            <option value="">Carregando cartões...</option>
          </select>
          <div class="form-text">Usado para calcular a competência conforme o dia de fechamento configurado.</div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="diaFechamentoOverride" class="form-label">Dia de fechamento (override opcional)</label>
            <input type="text" class="form-control" id="diaFechamentoOverride" placeholder="Ex.: 8 ou 2025-01-08">
            <div class="form-text">Use um número entre 1-31 ou uma data específica para esta importação.</div>
          </div>
          <div class="col-md-6">
            <label for="diaVencimentoOverride" class="form-label">Dia de vencimento (opcional)</label>
            <input type="text" class="form-control" id="diaVencimentoOverride" placeholder="Ex.: 15 ou 2025-01-15">
            <div class="form-text">Somente informativo por enquanto; útil para documentar o vencimento diferente no lote.</div>
          </div>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">Visualizar</button>
          <a href="transacoes.html" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
    <div id="progress-container" class="mb-3" style="display:none;"></div>
    <div id="import-errors"></div>
    <div id="import-confirm" style="display:none;">
      <button id="btn-importar" class="btn btn-success">Importar registros válidos</button>
    </div>
      <label class="form-label">Progresso da categorização:</label>
      <div class="progress">
        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;">0%</div>
      </div>
    </div>
    <div id="alerts"></div>
  <div id="grid"></div>
  </div>

  <app-footer></app-footer>

  <script src="assets/js/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
  <script>
    if (!localStorage.getItem('access_token')) {
      window.location.href = 'login.html';
    }

    function fetchJWT(url, options = {}) {
      const token = localStorage.getItem('access_token');
      const opts = { ...options };
      opts.headers = opts.headers ? { ...opts.headers } : {};
      if (token) {
        opts.headers['Authorization'] = `Bearer ${token}`;
      }
      return fetch(url, opts);
    }

    // Carrega categorias e formas de pagamento
  const selectCartao = document.getElementById('formaCartaoSelect');
  const diaFechamentoOverrideInput = document.getElementById('diaFechamentoOverride');
  const diaVencimentoOverrideInput = document.getElementById('diaVencimentoOverride');
  let categoriasBanco = [];
  let mapaCategorias = new Map();
    let formasCartao = [];
    let formaCartaoSelecionada = '';
    let validos = [];
    let gridInstance = null;
    async function carregarCategoriasBanco() {
      try {
        const resp = await fetch('http://127.0.0.1:5000/api/categorias?tipo=Despesa');
        if (resp.ok) {
          categoriasBanco = await resp.json();
          atualizarMapaCategorias();
        }
      } catch {}
    }
    function atualizarMapaCategorias() {
      mapaCategorias.clear();
      (categoriasBanco || []).forEach(cat => {
        if (cat?.nome) {
          mapaCategorias.set(cat.nome.trim().toLowerCase(), cat);
        }
      });
    }

    function encontrarCategoriaPorNome(nome = '') {
      if (!nome) return null;
      return mapaCategorias.get(nome.trim().toLowerCase()) || null;
    }

    carregarCategoriasBanco();

    async function carregarFormasCartao() {
      try {
        const resp = await fetchJWT('http://127.0.0.1:5000/api/formas_pagamento?cartao_credito=true&ativo=true');
        if (!resp.ok) {
          throw new Error('Falha ao carregar cartões');
        }
        formasCartao = await resp.json();
      } catch (error) {
        console.error('Erro ao carregar cartões de crédito:', error);
        formasCartao = [];
      } finally {
        popularSelectCartao();
      }
    }

    function removerAcentos(texto = '') {
      return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function normalizarValorNumerico(valor) {
      if (typeof valor === 'number' && Number.isFinite(valor)) {
        return valor;
      }
      if (valor === null || valor === undefined) {
        return 0;
      }
      const texto = String(valor).trim().replace(/\s+/g, '');
      const somentePermitidos = texto.replace(/[^0-9,.-]/g, '');
      const temVirgula = somentePermitidos.includes(',');
      const semSeparadores = temVirgula
        ? somentePermitidos.replace(/\./g, '')
        : somentePermitidos;
      const normalizado = semSeparadores.replace(/,/g, '.');
      const parsed = parseFloat(normalizado);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function normalizarDescricaoParcelada(texto = '') {
      return removerAcentos(texto)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'descricao';
    }

    function gerarParcelamentoId(descricao = '', totalParcelas = 1, valorParcela = 0) {
      const slug = normalizarDescricaoParcelada(descricao);
      const total = totalParcelas || 1;
      const valorTotal = Math.round(Math.abs(Number(valorParcela) || 0) * total * 100);
      return `${slug}-${total}x-${valorTotal}`;
    }

    function detectarParcelamento(descricao = '', valorParcela = 0) {
      const padraoValor = normalizarValorNumerico(valorParcela);
      const resultBase = {
        parcelado: false,
        parcelaAtual: 1,
        totalParcelas: 1,
        valorParcela: padraoValor,
        parcelamentoId: null,
        descricaoLimpa: descricao?.trim() || ''
      };
      if (!descricao) {
        return resultBase;
      }
      const padroes = [
        /parcela\s*\(\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\)/i,
        /parc\.?\s*(\d{1,2})\s*\/\s*(\d{1,2})/i,
        /(?:-|\s)parcela\s*(\d{1,2})\s*\/\s*(\d{1,2})/i,
        /(\d{1,2})\s*\/\s*(\d{1,2})\s*parc(?:elas)?/i
      ];
      for (const regex of padroes) {
        const match = descricao.match(regex);
        if (match) {
          const parcelaAtual = parseInt(match[1], 10) || 1;
          const totalParcelas = parseInt(match[2], 10) || parcelaAtual || 1;
          const descricaoLimpa = descricao
            .replace(regex, '')
            .replace(/\s{2,}/g, ' ')
            .replace(/-\s*-/, '-')
            .replace(/\s+-\s+/g, ' - ')
            .trim();
          return {
            parcelado: totalParcelas > 1,
            parcelaAtual,
            totalParcelas,
            valorParcela: padraoValor,
            parcelamentoId: gerarParcelamentoId(descricaoLimpa || descricao, totalParcelas, padraoValor),
            descricaoLimpa: descricaoLimpa || descricao.trim()
          };
        }
      }
      return resultBase;
    }

    function popularSelectCartao() {
      if (!selectCartao) return;
      selectCartao.innerHTML = '';
      const defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.textContent = formasCartao.length ? 'Selecione o cartão utilizado' : 'Nenhum cartão de crédito encontrado';
      selectCartao.appendChild(defaultOpt);
      formasCartao.forEach(fp => {
        const opt = document.createElement('option');
        opt.value = fp.id;
        const fechamento = fp.dia_fechamento ? ` (fecha dia ${fp.dia_fechamento})` : '';
        opt.textContent = `${fp.nome}${fechamento}`;
        selectCartao.appendChild(opt);
      });
      selectCartao.disabled = formasCartao.length === 0;
    }

    if (selectCartao) {
      selectCartao.addEventListener('change', (ev) => {
        formaCartaoSelecionada = ev.target.value || '';
      });
    }

    carregarFormasCartao();

    function iniciarAnimacaoProgresso(progressBar) {
      let percent = 0;
      progressBar.style.width = '0%';
      progressBar.innerText = '0%';
      const interval = setInterval(() => {
        if (percent >= 90) {
          return;
        }
        percent += 5;
        progressBar.style.width = percent + '%';
        progressBar.innerText = percent + '%';
      }, 200);
      return () => clearInterval(interval);
    }

    async function classificarDescricoesLote(descricoes, progressBar) {
      if (!descricoes.length) {
        return [];
      }
      const stopAnimacao = iniciarAnimacaoProgresso(progressBar);
      try {
        const resp = await fetch('http://127.0.0.1:5000/api/ia/classificar_categoria', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ descricoes })
        });
        if (!resp.ok) {
          throw new Error('Falha ao classificar categorias');
        }
        const data = await resp.json();
        const categoriasResp = Array.isArray(data.categorias) ? data.categorias : [];
        return descricoes.map((_, idx) => categoriasResp[idx] || 'Indefinida');
      } catch (error) {
        console.error('Erro ao classificar categorias:', error);
        alert('Não foi possível classificar automaticamente. Todas as categorias foram marcadas como Indefinida.');
        return descricoes.map(() => 'Indefinida');
      } finally {
        stopAnimacao();
        progressBar.style.width = '100%';
        progressBar.innerText = '100%';
      }
    }

    document.addEventListener('change', function(event) {
      if (!event.target.classList.contains('categoria-select')) {
        return;
      }
      const idx = parseInt(event.target.getAttribute('data-idx'));
      if (!Number.isNaN(idx) && validos[idx]) {
        const selecionadaId = Number(event.target.value) || null;
        const catInfo = categoriasBanco.find(cat => cat.id === selecionadaId);
        if (catInfo) {
          validos[idx].categoria_id = catInfo.id;
          validos[idx].categoria = catInfo.nome;
        } else {
          validos[idx].categoria_id = null;
          validos[idx].categoria = 'Indefinida';
        }
      }
    });

    document.getElementById('form-import-csv').addEventListener('submit', async function(ev) {
      ev.preventDefault();
      const input = document.getElementById('arquivoCartao');
      const alertsDiv = document.getElementById('alerts');
      alertsDiv.innerHTML = '';
      if (!input.files.length) {
        alert('Selecione um arquivo CSV!');
        return;
      }
      const file = input.files[0];
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: async function(results) {
          if (!results.data || !results.data.length) {
            alert('Nenhum dado encontrado no CSV.');
            return;
          }
          // Extrai descrições para classificação
          const descricoes = results.data.map(row => row.title);
          // Exibe barra de progresso
          const progressContainer = document.getElementById('progress-container');
          const progressBar = document.getElementById('progress-bar');
          progressContainer.style.display = 'block';
          const categorias = await classificarDescricoesLote(descricoes, progressBar);
          // Ao finalizar, exibe alert-success único
          alertsDiv.innerHTML = '';
          const alert = document.createElement('div');
          alert.className = 'alert alert-success';
          alert.role = 'alert';
          alert.innerText = `Categorização concluída! ${descricoes.length} registros processados.`;
          alertsDiv.appendChild(alert);
          setTimeout(() => { progressContainer.style.display = 'none'; }, 3000);

          // Validação dos dados
          const errosDiv = document.getElementById('import-errors');
          errosDiv.innerHTML = '';
          validos = [];
          let invalidos = [];
          validos = results.data.map((row, idx) => {
            const valorNumerico = normalizarValorNumerico(row.amount);
            const analiseParcelamento = detectarParcelamento(row.title || '', valorNumerico);
            const categoriaSugerida = categorias[idx] || 'Indefinida';
            const categoriaEncontrada = encontrarCategoriaPorNome(categoriaSugerida);
            return {
              ...row,
              amount: valorNumerico,
              categoria: categoriaEncontrada ? categoriaEncontrada.nome : (categoriaSugerida || 'Indefinida'),
              categoria_id: categoriaEncontrada ? categoriaEncontrada.id : null,
              parcelado: analiseParcelamento.parcelado,
              parcela_atual: analiseParcelamento.parcelaAtual,
              total_parcelas: analiseParcelamento.totalParcelas,
              parcelamento_id: analiseParcelamento.parcelamentoId,
              valor_parcela: analiseParcelamento.valorParcela,
              descricao_limpa: analiseParcelamento.descricaoLimpa
            };
          });

          // Exibe erros
          if (invalidos.length > 0) {
            const erroAlert = document.createElement('div');
            erroAlert.className = 'alert alert-danger';
            erroAlert.role = 'alert';
            erroAlert.innerText = `${invalidos.length} registros inválidos encontrados. Revise os erros na grid antes de importar.`;
            errosDiv.appendChild(erroAlert);
          }

          // Renderiza a grid sem coluna de erro
          if (!categoriasBanco.length) {
            await carregarCategoriasBanco();
          }
          function selectCategoriaHTML(sugerida, idx) {
            let html = `<select class='form-select form-select-sm categoria-select' data-idx='${idx}'>`;
            html += `<option value=''>Selecione</option>`;
            categoriasBanco.forEach(cat => {
              const selected = validos[idx]?.categoria_id === cat.id ? 'selected' : '';
              html += `<option value='${cat.id}' ${selected}>${cat.nome}</option>`;
            });
            html += `</select>`;
            return html;
          }
          const gridRows = validos.map((row, idx) => {
            const labelParcelamento = row.parcelado
              ? `Parc. ${row.parcela_atual}/${row.total_parcelas}`
              : 'À vista';
            return [
              row.date,
              row.title,
              row.amount,
              row.categoria || 'Indefinida',
              labelParcelamento,
              idx
            ];
          });
          if (gridInstance) {
            gridInstance.destroy();
          }
          gridInstance = new gridjs.Grid({
            columns: [
              { id: 'date', name: 'Data' },
              { id: 'title', name: 'Descrição' },
              { id: 'amount', name: 'Valor', formatter: v => `R$ ${parseFloat(v).toFixed(2)}` },
              { id: 'categoria_sugerida', name: 'Categoria Sugerida' },
              { id: 'parcelamento', name: 'Parcelamento' },
              {
                id: 'categoria_select',
                name: 'Categoria (Editar)',
                formatter: cell => {
                  const idx = typeof cell === 'number' ? cell : parseInt(cell);
                  const selecionada = validos[idx] ? validos[idx].categoria : 'Indefinida';
                  return gridjs.html(selectCategoriaHTML(selecionada, idx));
                }
              }
            ],
            data: gridRows,
            pagination: { enabled: true, limit: 20 },
            sort: true,
            search: true,
            width: '100%'
          }).render(document.getElementById('grid'));

          // Exibe botão de importação se houver registros válidos
          const importConfirm = document.getElementById('import-confirm');
          if (validos.length > 0) {
            importConfirm.style.display = 'block';
            document.getElementById('btn-importar').onclick = async function() {
              if (!formaCartaoSelecionada) {
                alert('Selecione o cartão de crédito que deseja usar para esta importação.');
                return;
              }
              const diaFechamentoOverride = diaFechamentoOverrideInput?.value?.trim() || '';
              const diaVencimentoOverride = diaVencimentoOverrideInput?.value?.trim() || '';
              // Envia os registros válidos para o backend
              try {
                const resp = await fetch('http://127.0.0.1:5000/api/importar_transacoes', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    forma_pagamento_id: parseInt(formaCartaoSelecionada, 10),
                    dia_fechamento_override: diaFechamentoOverride || null,
                    dia_vencimento_override: diaVencimentoOverride || null,
                    transacoes: validos.map(item => ({
                      ...item,
                      categoria_id: item.categoria_id || null
                    }))
                  })
                });
                if (resp.ok) {
                  const data = await resp.json();
                  // Esconde grid, barra de progresso, erros e controles
                  document.getElementById('grid').innerHTML = '';
                  document.getElementById('progress-container').style.display = 'none';
                  document.getElementById('import-errors').innerHTML = '';
                  importConfirm.style.display = 'none';
                  // Exibe alert-success e mantém o formulário de upload visível
                  alertsDiv.innerHTML = '';
                  const alert = document.createElement('div');
                  alert.className = 'alert alert-success';
                  alert.role = 'alert';
                  const parcelasExtras = data.parcelas_geradas ? ` ${data.parcelas_geradas} parcela(s) futura(s) gerada(s) como pendente(s).` : '';
                  const duplicadasIgnoradas = data.duplicadas_ignoradas ? ` ${data.duplicadas_ignoradas} registro(s) duplicado(s) ignorado(s).` : '';
                  alert.innerText = `Importação realizada com sucesso! ${data.sucesso} registro(s) importado(s).${parcelasExtras}${duplicadasIgnoradas}`;
                  alertsDiv.appendChild(alert);
                } else {
                  alert('Erro ao importar registros.');
                }
              } catch {
                alert('Erro de conexão ao importar registros.');
              }
            };
          } else {
            importConfirm.style.display = 'none';
          }
        }
      });
    });
  </script>
</body>
</html>
