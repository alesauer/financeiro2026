services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: financas-backend
    environment:
      DATABASE_URL: sqlite:////data/financas.db
      SECRET_KEY: docker-secret-key
      JWT_SECRET_KEY: docker-jwt-secret-key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BRAPI_API_TOKEN: ${BRAPI_API_TOKEN:-}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      MAILGUN_API_KEY: ""
      MAILGUN_DOMAIN: ""
      MAILGUN_BASE_URL: https://api.mailgun.net
      MAILGUN_FROM: ""
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,backend,frontend,api.openai.com,api.deepseek.com
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: localhost,127.0.0.1,backend,frontend,api.openai.com,api.deepseek.com
    ports:
      - "5001:5000"
    volumes:
      - sqlite_data:/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
      - ./app:/app/app
      - ./services:/app/services
      - ./scripts:/app/scripts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: financas-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  sqlite_data:
