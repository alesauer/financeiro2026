<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Formas de Pagamento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/nav.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav-bar></nav-bar>

  <div class="container mt-4">
    <h2>Formas de Pagamento</h2>
    <div id="alert-area"></div>
    <button class="btn btn-primary mb-3" id="btnAddForma">Adicionar Forma</button>
    <div class="table-responsive">
      <table class="table table-bordered table-hover" id="formasTable">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Cartão Crédito</th>
            <th>Ativo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <!-- Linhas via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Adicionar/Editar Forma de Pagamento -->
  <div class="modal fade" id="formaModal" tabindex="-1" aria-labelledby="formaModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="formaModalLabel">Adicionar Forma</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <form id="formaForm">
            <div class="mb-3">
              <label for="formaId" class="form-label">ID</label>
              <input type="text" class="form-control" id="formaId" disabled>
            </div>
            <div class="mb-3">
              <label for="formaNome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="formaNome" required>
            </div>
            <div class="mb-3">
              <label for="formaTipo" class="form-label">Tipo</label>
              <input type="text" class="form-control" id="formaTipo" placeholder="Ex.: Dinheiro, Pix, Cartão de Crédito" required>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="formaCartaoCredito">
              <label class="form-check-label" for="formaCartaoCredito">Cartão de Crédito</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="formaAtivo" checked>
              <label class="form-check-label" for="formaAtivo">Ativo</label>
            </div>
            <input type="hidden" id="modalMode" value="add">
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="saveFormaBtn">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (!localStorage.getItem('access_token')) {
      window.location.href = 'login.html';
    }
  </script>
  <script src="assets/js/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/formas_pagamento.js"></script>
</body>
</html>
