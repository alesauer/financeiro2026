<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/nav.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav-bar></nav-bar>

    <div class="container mt-4">
        <h2>Categorias</h2>
        <div id="alert-area"></div>
        <button class="btn btn-primary mb-3" id="btnAddCategoria">Adicionar Categoria</button>
        <div class="table-responsive">
            <table class="table table-bordered table-hover" id="categoriasTable">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linhas geradas via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Adicionar/Editar Categoria -->
    <div class="modal fade" id="categoriaModal" tabindex="-1" aria-labelledby="categoriaModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="categoriaModalLabel">Adicionar Categoria</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <form id="categoriaForm">
              <div class="mb-3">
                <label for="categoriaId" class="form-label">ID</label>
                <input type="text" class="form-control" id="categoriaId" disabled>
              </div>
              <div class="mb-3">
                <label for="categoriaNome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="categoriaNome" required>
              </div>
              <div class="mb-3">
                <label for="categoriaTipo" class="form-label">Tipo</label>
                <select class="form-select" id="categoriaTipo" required>
                  <option value="">Selecione...</option>
                  <option value="Receita">Receita</option>
                  <option value="Despesa">Despesa</option>
                  <option value="Investimento">Investimento</option>
                </select>
              </div>
              <input type="hidden" id="modalMode" value="add">
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="saveCategoriaBtn">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <app-footer></app-footer>

    <script>
      if (!localStorage.getItem('access_token')) {
        window.location.href = 'login.html';
      }
    </script>
  <script src="assets/js/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/categorias.js"></script>
</body>
</html>
