<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categorias - Finanças</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link type="text/css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsgrid/dist/jsgrid.min.css" />
<link type="text/css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsgrid/dist/jsgrid-theme.min.css" />
</head>
<body class="bg-light">
<div class="container py-4">
  <h3 class="mb-4 text-center">Gerenciar Categorias</h3>
  <div id="jsGrid"></div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jsgrid/dist/jsgrid.min.js"></script>
<script>
$(function() {
  $("#jsGrid").jsGrid({
    width: "100%",
    inserting: true,
    editing: true,
    sorting: true,
    paging: true,
    autoload: true,
    pageSize: 10,
    controller: {
      loadData: function() {
        return $.ajax({ type: "GET", url: "http://127.0.0.1:5000/api/categorias", dataType: "json" });
      },
      insertItem: function(item) {
        return $.ajax({ type: "POST", url: "http://127.0.0.1:5000/api/categorias", data: JSON.stringify(item), contentType: "application/json" });
      },
      updateItem: function(item) {
        return $.ajax({ type: "PUT", url: "http://127.0.0.1:5000/api/categorias/" + item.id, data: JSON.stringify(item), contentType: "application/json" });
      },
      deleteItem: function(item) {
        return $.ajax({ type: "DELETE", url: "http://127.0.0.1:5000/api/categorias/" + item.id });
      }
    },
    fields: [
      { name: "id", type: "number", width: 40, editing: false },
      { name: "nome", type: "text", title: "Nome" },
      { type: "control" }
    ]
  });
});
</script>
</body>
</html>
