<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="18" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="12" y1="42" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Fundo arredondado vibrante -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" />
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />

  <!-- Barras de crescimento financeiro -->
  <rect x="13" y="36" width="8" height="14" rx="3" fill="url(#barGrad)" />
  <rect x="25" y="29" width="8" height="21" rx="3" fill="url(#barGrad)" />
  <rect x="37" y="22" width="8" height="28" rx="3" fill="url(#barGrad)" />
  <rect x="49" y="15" width="4" height="35" rx="2" fill="#34d399" fill-opacity="0.45" />

  <!-- Linha de tendencia ascendente em "M" / Seta Dourada -->
  <path
    d="M13 31 L23 21 L31 27 L47 11"
    stroke="url(#arrowGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M38 11 H47 V20"
    stroke="url(#arrowGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Ponto de destaque (Moeda/Meta no topo) -->
  <circle cx="47" cy="11" r="3.5" fill="#fef08a" />
</svg>
