<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Minhas Finanças</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="assets/css/nav.css" rel="stylesheet">
    <link href="assets/css/login.css" rel="stylesheet">
    
    <script src="assets/js/nav.js" defer></script>
</head>
<body class="login-page no-sidebar">

    <!-- NAVBAR -->
    <nav-bar></nav-bar>

    <!-- Login Container -->
    <div class="login-container">
        <div class="card login-card">
            
            <!-- Ícone -->
            <div class="login-icon">
                <i class="bi bi-wallet2"></i>
            </div>

            <!-- Título -->
            <h2 class="login-title">Minhas Finanças</h2>
            <p class="login-subtitle">Entre para gerenciar seu patrimônio</p>

            <!-- Formulário -->
            <form id="loginForm" class="login-form">
                
                <!-- Email -->
                <label for="email">Email</label>
                <div class="input-group-login">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                </div>

                <!-- Senha -->
                <label for="senha">Senha</label>
                <div class="input-group-login">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" class="form-control" id="senha" placeholder="••••••" required>
                </div>

                <!-- Botão -->
                <button type="submit" class="btn btn-login w-100">
                    Acessar Conta
                    <i class="bi bi-arrow-right"></i>
                </button>

                <!-- Mensagem -->
                <div id="msg"></div>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
                <a href="#" class="create-account">Criar conta</a>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <app-footer></app-footer>

    <script src="assets/js/login.js"></script>
</body>
</html>
