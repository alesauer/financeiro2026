<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importar Cartão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/nav.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav-bar></nav-bar>

  <div class="container py-4">
    <h2 class="mb-4">Importar Cartão</h2>
    <div class="card p-4 mb-4">
      <form id="form-import-csv">
        <div class="mb-3">
          <label for="arquivoCartao" class="form-label">Selecione o arquivo do cartão (.csv):</label>
          <input class="form-control" type="file" id="arquivoCartao" accept=".csv">
        </div>
        <button type="submit" class="btn btn-primary">Visualizar</button>
      </form>
    </div>
    <div id="progress-container" class="mb-3" style="display:none;">
      <label class="form-label">Progresso da categorização:</label>
      <div class="progress">
        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;">0%</div>
      </div>
    </div>
    <div id="alerts"></div>
  <div id="grid"></div>
  </div>

  <script src="assets/js/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
  <script>
    document.getElementById('form-import-csv').addEventListener('submit', async function(ev) {
      ev.preventDefault();
      const input = document.getElementById('arquivoCartao');
      const alertsDiv = document.getElementById('alerts');
      alertsDiv.innerHTML = '';
      if (!input.files.length) {
        alert('Selecione um arquivo CSV!');
        return;
      }
      const file = input.files[0];
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: async function(results) {
          if (!results.data || !results.data.length) {
            alert('Nenhum dado encontrado no CSV.');
            return;
          }
          // Extrai descrições para classificação
          const descricoes = results.data.map(row => row.title);
          let categorias = [];
          // Exibe barra de progresso
          const progressContainer = document.getElementById('progress-container');
          const progressBar = document.getElementById('progress-bar');
          progressContainer.style.display = 'block';
          progressBar.style.width = '0%';
          progressBar.innerText = '0%';
          categorias = [];
          for (let i = 0; i < descricoes.length; i++) {
            let categoria = 'Indefinida';
            try {
              const resp = await fetch('http://127.0.0.1:5000/api/ia/classificar_categoria', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ descricoes: [descricoes[i]] })
              });
              if (resp.ok) {
                const data = await resp.json();
                categoria = data.categorias && data.categorias[0] ? data.categorias[0] : 'Indefinida';
              }
            } catch {}
            categorias.push(categoria);
            // Atualiza barra de progresso
            const percent = Math.round(((i + 1) / descricoes.length) * 100);
            progressBar.style.width = percent + '%';
            progressBar.innerText = percent + '%';
          }
          // Ao finalizar, exibe alert-success único
          alertsDiv.innerHTML = '';
          const alert = document.createElement('div');
          alert.className = 'alert alert-success';
          alert.role = 'alert';
          alert.innerText = `Categorização concluída! ${descricoes.length} registros processados.`;
          alertsDiv.appendChild(alert);
          // Esconde barra de progresso após alguns segundos
          setTimeout(() => { progressContainer.style.display = 'none'; }, 3000);
          // Monta os dados para Grid.js
          const columns = [
            { id: 'date', name: 'Data' },
            { id: 'title', name: 'Descrição' },
            { id: 'amount', name: 'Valor', formatter: v => `R$ ${parseFloat(v).toFixed(2)}` },
            { id: 'categoria', name: 'Categoria Sugerida' }
          ];
          const rows = results.data.map((row, idx) => [row.date, row.title, row.amount, categorias[idx] || 'Indefinida']);
          // Renderiza a grid
          new gridjs.Grid({
            columns: columns,
            data: rows,
            pagination: { enabled: true, limit: 20 },
            sort: true,
            search: true,
            width: '100%'
          }).render(document.getElementById('grid'));
        }
      });
    });
  </script>
</body>
</html>
