<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parcelamentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
  <link href="assets/css/nav.css" rel="stylesheet">
  <link href="assets/css/parcelamentos.css" rel="stylesheet">
  <script src="assets/js/nav.js" defer></script>
</head>
<body class="bg-light">
  <nav-bar></nav-bar>

  <div class="container py-3" id="parcelamentos-cards">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <div class="card metric-card gradient-blue text-white">
          <div class="card-body">
            <p class="metric-label">Parcelamentos vigentes</p>
            <h3 class="metric-value" id="card-parcelamentos-qtd">0</h3>
            <small class="metric-subtitle" id="card-parcelamentos-periodo">Período atual</small>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="card metric-card gradient-green text-white">
          <div class="card-body">
            <p class="metric-label">Valor total previsto</p>
            <h3 class="metric-value" id="card-parcelamentos-valor">R$ 0,00</h3>
            <small class="metric-subtitle">Somatório das parcelas no período</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <div class="card shadow-sm mb-4" id="parcelamentos-anual">
      <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
          <h5 class="mb-0">Sumário anual de parcelamentos</h5>
          <small class="text-muted">Valores previstos por mês</small>
        </div>
        <div class="d-flex align-items-center gap-2">
          <label for="parcelamentosAno" class="mb-0">Ano:</label>
          <select id="parcelamentosAno" class="form-select form-select-sm"></select>
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-sm align-middle text-center" id="parcelamentosTabelaAnual">
            <thead class="table-light">
              <tr>
                <th>Sumário</th>
                <th>Jan</th>
                <th>Fev</th>
                <th>Mar</th>
                <th>Abr</th>
                <th>Mai</th>
                <th>Jun</th>
                <th>Jul</th>
                <th>Ago</th>
                <th>Set</th>
                <th>Out</th>
                <th>Nov</th>
                <th>Dez</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="parcelamentosTabelaAnualBody">
              <tr>
                <td class="fw-bold">Parcelamentos</td>
                <td colspan="13">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="parcelamentos-toolbar d-flex flex-wrap gap-2 align-items-center mb-3">
      <div class="d-flex align-items-center gap-2 flex-wrap w-100">
        <button id="parcelamentosPrevMonth" class="btn btn-outline-primary btn-sm">←</button>
        <div id="parcelamentosCurrentMonthLabel" class="fw-bold flex-grow-1"></div>
        <button id="parcelamentosNextMonth" class="btn btn-outline-primary btn-sm">→</button>
        <label for="parcelamentosMonthPicker" class="ms-2 me-1 mb-0">Selecionar mês:</label>
        <input id="parcelamentosMonthPicker" type="month" class="form-control form-control-sm" />
      </div>
    </div>

    <div id="parcelamentos-grid"></div>
  </div>

  <app-footer></app-footer>

  <script>
    if (!localStorage.getItem('access_token')) {
      window.location.href = 'login.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
  <script src="assets/js/parcelamentos.js"></script>
</body>
</html>
