<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investimentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/nav.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav-bar></nav-bar>

  <div class="container py-4">
    <h2 class="mb-4">Investimentos</h2>

    <!-- Filtros -->
    <form id="filtros" class="row g-3 mb-3">
      <div class="col-12 col-md-3">
        <label class="form-label">Ano de referência</label>
        <select id="filtro-ano" class="form-select"></select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Categoria</label>
        <select id="filtro-categoria" class="form-select">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="col-12 col-md-3 d-flex align-items-end">
        <button type="button" id="btn-aplicar" class="btn btn-primary w-100">Aplicar</button>
      </div>
    </form>

    <!-- KPIs -->
    <div class="row mb-3">
      <div class="col-md-3 mb-3">
        <div class="card h-100">
          <div class="card-body">
            <div class="text-muted">Total investido (ano)</div>
            <div id="kpi-total-mes" class="h4 mb-0">R$ 0,00</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card h-100">
          <div class="card-body">
            <div class="text-muted">Total no período</div>
            <div id="kpi-total-periodo" class="h4 mb-0">R$ 0,00</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card h-100">
          <div class="card-body">
            <div class="text-muted">Qtde aportes</div>
            <div id="kpi-qtde" class="h4 mb-0">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card h-100">
          <div class="card-body">
            <div class="text-muted">Aporte médio</div>
            <div id="kpi-medio" class="h4 mb-0">R$ 0,00</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Gráficos -->
    <div class="row mb-4">
      <div class="col-md-8 mb-3">
        <div class="card h-100">
          <div class="card-header">Evolução no ano</div>
          <div class="card-body">
            <canvas id="grafico-evolucao" height="120"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card h-100">
          <div class="card-header">Por categoria (período)</div>
          <div class="card-body">
            <canvas id="grafico-categorias" height="120"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabela -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Lançamentos de investimentos</span>
        <small class="text-muted" id="paginacao-info"></small>
      </div>
      <div class="table-responsive">
        <table class="table table-striped mb-0">
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th class="text-end">Valor</th>
              <th>Forma</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-investimentos">
            <!-- linhas -->
          </tbody>
        </table>
      </div>
      <div class="card-footer d-flex justify-content-between align-items-center">
        <div>
          <button class="btn btn-outline-secondary btn-sm" id="btn-prev">Anterior</button>
          <button class="btn btn-outline-secondary btn-sm" id="btn-next">Próximo</button>
        </div>
      </div>
    </div>

  </div>

  <app-footer></app-footer>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/investimentos.js"></script>
</body>
</html>
