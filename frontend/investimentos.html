<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investimentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/nav.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav-bar></nav-bar>

  <div class="container py-4">
    <h2 class="mb-4">Investimentos</h2>

    <!-- Filtros -->
    <form id="filtros" class="row g-3 mb-3">
      <div class="col-12 col-md-3">
        <label class="form-label">Início</label>
        <input type="date" id="inicio" class="form-control" />
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Fim</label>
        <input type="date" id="fim" class="form-control" />
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Categoria</label>
        <select id="filtro-categoria" class="form-select">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="col-12 col-md-3 d-flex align-items-end gap-2">
        <button type="button" id="btn-aplicar" class="btn btn-primary w-50">Aplicar</button>
        <button type="button" id="btn-novo" class="btn btn-success w-50" data-bs-toggle="modal" data-bs-target="#modal-investimento">Novo</button>
      </div>
    </form>

    <!-- KPIs -->
    <div class="row mb-3">
      <div class="col-md-3 mb-3">
        <div class="card h-100">
          <div class="card-body">
            <div class="text-muted">Total investido (mês)</div>
            <div id="kpi-total-mes" class="h4 mb-0">R$ 0,00</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card h-100">
          <div class="card-body">
            <div class="text-muted">Total no período</div>
            <div id="kpi-total-periodo" class="h4 mb-0">R$ 0,00</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card h-100">
          <div class="card-body">
            <div class="text-muted">Qtde aportes</div>
            <div id="kpi-qtde" class="h4 mb-0">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card h-100">
          <div class="card-body">
            <div class="text-muted">Aporte médio</div>
            <div id="kpi-medio" class="h4 mb-0">R$ 0,00</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Gráficos -->
    <div class="row mb-4">
      <div class="col-md-8 mb-3">
        <div class="card h-100">
          <div class="card-header">Evolução no mês</div>
          <div class="card-body">
            <canvas id="grafico-evolucao" height="120"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card h-100">
          <div class="card-header">Por categoria (período)</div>
          <div class="card-body">
            <canvas id="grafico-categorias" height="120"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabela -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Lançamentos de investimentos</span>
        <small class="text-muted" id="paginacao-info"></small>
      </div>
      <div class="table-responsive">
        <table class="table table-striped mb-0">
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th class="text-end">Valor</th>
              <th>Forma</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-investimentos">
            <!-- linhas -->
          </tbody>
        </table>
      </div>
      <div class="card-footer d-flex justify-content-between align-items-center">
        <div>
          <button class="btn btn-outline-secondary btn-sm" id="btn-prev">Anterior</button>
          <button class="btn btn-outline-secondary btn-sm" id="btn-next">Próximo</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Modal Novo Investimento -->
  <div class="modal fade" id="modal-investimento" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Novo investimento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="form-investimento" class="row g-3">
            <div class="col-12">
              <label class="form-label">Descrição</label>
              <input type="text" id="nv-descricao" class="form-control" required>
            </div>
            <div class="col-6">
              <label class="form-label">Data</label>
              <input type="date" id="nv-data" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label">Valor</label>
              <input type="number" step="0.01" id="nv-valor" class="form-control" required>
            </div>
            <div class="col-6">
              <label class="form-label">Categoria</label>
              <select id="nv-categoria" class="form-select" required></select>
            </div>
            <div class="col-6">
              <label class="form-label">Forma de pagamento</label>
              <input type="text" id="nv-forma" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label">Status</label>
              <select id="nv-status" class="form-select">
                <option value="Pago">Pago</option>
                <option value="Pendente">Pendente</option>
              </select>
            </div>
          </form>
          <div id="nv-msg" class="small mt-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="button" id="btn-salvar" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/investimentos.js"></script>
</body>
</html>
