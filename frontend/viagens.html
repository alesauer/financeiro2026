<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planejamento de Viagens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet">
  <link href="assets/css/nav.css" rel="stylesheet">
  <style>
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: .85rem;
      padding: .35rem .75rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .status-planejada { background: #eef5ff; color: #0d6efd; }
    .status-em-andamento { background: #fff4e5; color: #fd7e14; }
    .status-finalizada { background: #e6f4ea; color: #198754; }
    .status-cancelada { background: #fde2e4; color: #dc3545; }
    #grid-viagens .gridjs-th:nth-child(1),
    #grid-viagens .gridjs-td:nth-child(1) { display: none; }
    .summary-item {
      border-radius: 12px;
      padding: 0.75rem 1rem;
      background: #f8fafc;
      border: 1px solid #eef2f7;
    }
    .gridjs-tr.viagem-selecionada td {
      background: #e7f1ff !important;
      transition: background .2s ease;
    }
    .card-grid .card-body {
      padding: 1.5rem;
    }
    #grid-viagens .gridjs-table td,
    #grid-viagens .gridjs-table th {
      padding: 0.85rem 1rem;
    }
    #grid-viagens .gridjs-table th:last-child,
    #grid-viagens .gridjs-table td:last-child {
      padding-right: 1.25rem;
    }
    @media (max-width: 991px) {
      .card-grid .card-body {
        padding: 1.25rem;
      }
    }
  </style>
  <script>
    (function(){
      const t = localStorage.getItem('access_token');
      if(!t){ window.location.href = 'login.html'; }
    })();
  </script>
</head>
<body class="bg-light">
  <nav-bar></nav-bar>

  <div class="container-fluid px-4 py-4">
    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center mb-4 gap-3">
      <div>
        <h2 class="mb-1">Viagens</h2>
        <p class="text-muted mb-0">Cadastre roteiros, registre custos e acompanhe o orçamento em um só lugar.</p>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" id="btn-nova-viagem">
          <i class="bi bi-plus-circle me-1"></i> Nova Viagem
        </button>
      </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Buscar por título ou destino</label>
            <input type="search" id="filtro-busca" class="form-control" placeholder="Ex.: Portugal" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select id="filtro-status" class="form-select">
              <option value="">Todos</option>
              <option value="Planejada">Planejada</option>
              <option value="Em andamento">Em andamento</option>
              <option value="Finalizada">Finalizada</option>
              <option value="Cancelada">Cancelada</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Ordenar por</label>
            <select id="filtro-ordenacao" class="form-select">
              <option value="data_inicio">Data</option>
              <option value="destino">Destino</option>
              <option value="custo_total">Custo total</option>
            </select>
          </div>
          <div class="col-md-2 d-flex gap-2">
            <button class="btn btn-outline-secondary w-100" id="btn-limpar-filtros">Limpar</button>
            <button class="btn btn-primary w-100" id="btn-aplicar-filtros">Aplicar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="card shadow-sm border-0 h-100 card-grid">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
              <div>
                <h5 class="mb-0">Viagens cadastradas</h5>
                <div class="text-muted small">Clique em “Ver” para acessar a página dedicada da viagem.</div>
              </div>
              <span class="badge bg-light text-dark" id="contador-viagens">0 viagens</span>
            </div>
            <div id="grid-viagens" class="table-responsive"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Viagem -->
  <div class="modal fade" id="modalViagem" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModalViagem">Nova Viagem</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formViagem" class="row g-3">
            <input type="hidden" id="viagem_id" />
            <div class="col-md-6">
              <label class="form-label">Título</label>
              <input type="text" class="form-control" id="viagem_titulo" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Destino</label>
              <input type="text" class="form-control" id="viagem_destino" required />
            </div>
            <div class="col-md-3">
              <label class="form-label">Data início</label>
              <input type="date" class="form-control" id="viagem_data_inicio" required />
            </div>
            <div class="col-md-3">
              <label class="form-label">Data término</label>
              <input type="date" class="form-control" id="viagem_data_termino" required />
            </div>
            <div class="col-md-3">
              <label class="form-label">Status</label>
              <select class="form-select" id="viagem_status">
                <option value="Planejada">Planejada</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Finalizada">Finalizada</option>
                <option value="Cancelada">Cancelada</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Descrição / Observações</label>
              <textarea class="form-control" id="viagem_descricao" rows="3"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" id="btn-salvar-viagem">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Custo -->
  <div class="modal fade" id="modalCusto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModalCusto">Novo Custo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formCusto" class="row g-3">
            <input type="hidden" id="custo_id" />
            <div class="col-12">
              <label class="form-label">Nome do custo</label>
              <input type="text" class="form-control" id="custo_nome" required />
            </div>
            <div class="col-12">
              <label class="form-label">Descrição detalhada</label>
              <textarea class="form-control" id="custo_descricao" rows="2" required></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Valor</label>
              <input type="number" min="0" step="0.01" class="form-control" id="custo_valor" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Link (opcional)</label>
              <input type="url" class="form-control" id="custo_link" placeholder="https://" />
            </div>
            <div class="col-12">
              <label class="form-label">Observação</label>
              <textarea class="form-control" id="custo_observacao" rows="2" placeholder="Detalhes importantes"></textarea>
            </div>
            <div class="col-12">
              <button class="btn btn-link px-0 text-decoration-none" type="button" data-bs-toggle="collapse" data-bs-target="#custoCamposAvancados" aria-expanded="true">
                Mostrar / ocultar detalhes opcionais
              </button>
            </div>
            <div class="col-12 collapse show" id="custoCamposAvancados">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Tipo</label>
                  <select class="form-select" id="custo_tipo">
                    <option value="Transporte">Transporte</option>
                    <option value="Hospedagem">Hospedagem</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Passeios">Passeios</option>
                    <option value="Outros" selected>Outros</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Data do gasto</label>
                  <input type="date" class="form-control" id="custo_data" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Forma de pagamento</label>
                  <input type="text" class="form-control" id="custo_forma_pagamento" placeholder="Cartão, PIX..." />
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" id="btn-salvar-custo">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <app-footer></app-footer>

  <script src="assets/js/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/viagens.js"></script>
</body>
</html>
