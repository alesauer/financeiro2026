<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milhas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet">
  <link href="assets/css/nav.css" rel="stylesheet">
  <style>
    /* Oculta a primeira coluna (ID) da grid visualmente */
    #grid-milhas .gridjs-table th:nth-child(1),
    #grid-milhas .gridjs-table td:nth-child(1) { display: none; }
  </style>
  <script>
    // Garante que apenas usuários autenticados acessem
    (function(){
      const t = localStorage.getItem('access_token');
      if(!t){ window.location.href = 'login.html'; }
    })();
  </script>
  <!-- Grid.js e Bootstrap JS no final do body -->
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav-bar></nav-bar>

  <div class="container py-4">
    <h2 class="mb-4">Milhas</h2>
    <!-- Botão Nova Movimentação -->
    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-success" id="btn-nova-milha">Nova Movimentação</button>
    </div>

    <!-- Grid -->
    <div id="grid-milhas"></div>

    <!-- Modal Nova/Editar Milha -->
    <div class="modal fade" id="modalMilha" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalMilha">Nova Movimentação</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="formMilha">
              <input type="hidden" id="milha_id" />
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Programa</label>
                  <input type="text" class="form-control" id="programa" required />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Tipo</label>
                  <select class="form-select" id="tipo" required>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Quantidade</label>
                  <input type="number" min="1" class="form-control" id="quantidade" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Origem</label>
                  <input type="text" class="form-control" id="origem" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Data Movimentação</label>
                  <input type="date" class="form-control" id="data_movimentacao" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Data Expiração</label>
                  <input type="date" class="form-control" id="data_expiracao" />
                </div>
                <div class="col-md-12">
                  <label class="form-label">Descrição</label>
                  <textarea class="form-control" id="descricao" rows="3"></textarea>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btn-salvar-milha">Salvar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <app-footer></app-footer>

  <script src="assets/js/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/milhas.js"></script>
</body>
</html>
