<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lembretes Financeiros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet">
  <link href="assets/css/nav.css" rel="stylesheet">
  <style>
    .card-metric {
      border-radius: 16px;
      border: none;
      box-shadow: 0 1rem 2rem rgba(15,23,42,.08);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .card-metric:hover {
      transform: translateY(-4px);
      box-shadow: 0 1.25rem 2.25rem rgba(15,23,42,.12);
    }
    .pill-filter {
      border-radius: 999px;
    }
    #grid-lembretes .gridjs-table td {
      vertical-align: middle;
    }
    #grid-lembretes .gridjs-table th:nth-child(1),
    #grid-lembretes .gridjs-table td:nth-child(1) {
      display: none;
    }
  </style>
  <script>
    (function(){
      const t = localStorage.getItem('access_token');
      if(!t){ window.location.href = 'login.html'; }
    })();
  </script>
</head>
<body class="bg-light">
  <nav-bar></nav-bar>

  <div class="container py-4">
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
      <div>
        <h2 class="mb-0">Lembretes</h2>
        <small class="text-muted">Organize tarefas, contas e metas do dia a dia</small>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" id="btn-atualizar">
          <i class="bi bi-arrow-repeat me-1"></i> Atualizar
        </button>
        <button class="btn btn-primary" id="btn-novo-lembrete">
          <i class="bi bi-plus-lg me-1"></i> Novo Lembrete
        </button>
      </div>
    </div>

    <div class="row g-3 mb-4" id="cards-resumo">
      <div class="col-md-3 col-sm-6">
        <div class="card card-metric text-center h-100">
          <div class="card-body">
            <p class="text-muted text-uppercase small mb-1">Total</p>
            <h3 class="fw-bold mb-0" id="metric-total">--</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="card card-metric text-center h-100">
          <div class="card-body">
            <p class="text-muted text-uppercase small mb-1">Pendentes</p>
            <h3 class="fw-bold text-warning mb-0" id="metric-pendentes">--</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="card card-metric text-center h-100">
          <div class="card-body">
            <p class="text-muted text-uppercase small mb-1">Para Hoje</p>
            <h3 class="fw-bold text-danger mb-0" id="metric-hoje">--</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="card card-metric text-center h-100">
          <div class="card-body">
            <p class="text-muted text-uppercase small mb-1">Concluídos</p>
            <h3 class="fw-bold text-success mb-0" id="metric-concluidos">--</h3>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="filtro-status">
              <option value="">Todos</option>
              <option value="Pendente">Pendentes</option>
              <option value="Concluído">Concluídos</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Prioridade</label>
            <select class="form-select" id="filtro-prioridade">
              <option value="">Todas</option>
              <option value="Alta">Alta</option>
              <option value="Média">Média</option>
              <option value="Baixa">Baixa</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Data início</label>
            <input type="date" class="form-control" id="filtro-data-inicio">
          </div>
          <div class="col-md-2">
            <label class="form-label">Data fim</label>
            <input type="date" class="form-control" id="filtro-data-fim">
          </div>
          <div class="col-md-2">
            <label class="form-label">Buscar</label>
            <input type="text" class="form-control" id="filtro-busca" placeholder="Título, categoria...">
          </div>
          <div class="col-12 d-flex justify-content-end gap-2">
            <button class="btn btn-outline-secondary pill-filter" id="btn-limpar-filtros">Limpar</button>
            <button class="btn btn-primary pill-filter" id="btn-aplicar-filtros">Aplicar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4" id="lista-proximos" style="display:none;"></div>

    <div id="grid-lembretes" class="bg-white rounded shadow-sm p-3"></div>

    <div class="modal fade" id="modalLembrete" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalLembrete">Novo Lembrete</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="formLembrete">
              <input type="hidden" id="lembrete_id">
              <div class="row g-3">
                <div class="col-md-8">
                  <label class="form-label">Título</label>
                  <input type="text" class="form-control" id="titulo" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Categoria</label>
                  <input type="text" class="form-control" id="categoria" maxlength="50">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Data</label>
                  <input type="date" class="form-control" id="data_lembrete">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Hora</label>
                  <input type="time" class="form-control" id="hora_lembrete">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Prioridade</label>
                  <select class="form-select" id="prioridade">
                    <option value="Alta">Alta</option>
                    <option value="Média" selected>Média</option>
                    <option value="Baixa">Baixa</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label">Descrição</label>
                  <textarea class="form-control" id="descricao" rows="3" placeholder="Anote detalhes importantes..."></textarea>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Status</label>
                  <select class="form-select" id="status">
                    <option value="Pendente" selected>Pendente</option>
                    <option value="Concluído">Concluído</option>
                  </select>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btn-salvar-lembrete">Salvar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-footer></app-footer>

  <script src="assets/js/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/lembretes.js"></script>
</body>
</html>
